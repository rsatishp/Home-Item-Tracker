name: Deploy Home Tracker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_path:
        description: "Override base path (e.g. / for a root Pages repo). Leave blank to auto-detect."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_user_agent: pnpm

      - name: Build
        run: pnpm --filter @workspace/home-tracker run build
        env:
          NODE_ENV: production
          # Auto-detects /<repo-name>/ for project repos.
          # For a root Pages repo (username.github.io), use the workflow_dispatch override.
          BASE_PATH: ${{ inputs.base_path || format('/{0}/', github.event.repository.name) }}

      - name: Add SPA routing fallback
        run: cp artifacts/home-tracker/dist/public/index.html artifacts/home-tracker/dist/public/404.html

      - name: Disable Jekyll processing
        run: touch artifacts/home-tracker/dist/public/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: artifacts/home-tracker/dist/public
          publish_branch: gh-pages
          force_orphan: true
